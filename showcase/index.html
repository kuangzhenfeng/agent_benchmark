<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="一只水獭操作手摇苹果削皮机的 SVG 2D 动画展示。">
  <title>水獭的苹果削皮工坊</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: oklch(0.11 0 0);
      --surface: oklch(0.17 0.014 294);
      --surface-2: oklch(0.22 0.025 294);
      --ink: oklch(0.96 0.01 294);
      --muted: oklch(0.72 0.025 294);
      --primary: oklch(0.58 0.15 294);
      --primary-hi: oklch(0.72 0.14 294);
      --accent: oklch(0.72 0.17 45);
      --apple: oklch(0.59 0.20 26);
      --apple-hi: oklch(0.72 0.18 35);
      --leaf: oklch(0.67 0.15 148);
      --steel: oklch(0.70 0.035 250);
      --line: oklch(0.38 0.045 294);
      --radius: 14px;
      --ease: cubic-bezier(.16, 1, .3, 1);
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100svh;
      color: var(--ink);
      background: var(--bg);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      text-rendering: optimizeLegibility;
    }

    button { font: inherit; }
    .page { min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px clamp(20px, 4vw, 64px);
      border-bottom: 1px solid var(--line);
    }

    .brand { display: flex; align-items: center; gap: 10px; font-weight: 760; letter-spacing: -0.02em; }
    .brand-mark {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 5px oklch(0.72 0.17 45 / .14);
    }
    .top-note { color: var(--muted); font-size: 13px; }

    main {
      display: grid;
      grid-template-columns: minmax(260px, .72fr) minmax(560px, 1.5fr);
      align-items: center;
      gap: clamp(28px, 5vw, 92px);
      padding: clamp(28px, 5vw, 72px) clamp(20px, 4vw, 64px);
    }

    .intro { max-width: 520px; }
    h1 {
      margin: 0 0 22px;
      font-size: clamp(42px, 5.4vw, 82px);
      line-height: .96;
      letter-spacing: -0.04em;
      text-wrap: balance;
    }

    .lede {
      margin: 0;
      max-width: 48ch;
      color: var(--muted);
      font-size: clamp(16px, 1.5vw, 20px);
      line-height: 1.65;
      text-wrap: pretty;
    }

    .beats { display: flex; flex-wrap: wrap; gap: 9px; margin: 28px 0 0; padding: 0; list-style: none; }
    .beats li { padding: 8px 12px; color: var(--ink); background: var(--surface-2); border-radius: 999px; font-size: 13px; }
    .stage-wrap { min-width: 0; }
    .stage {
      position: relative;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: inset 0 0 0 1px var(--line);
      isolation: isolate;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 65% 40%, oklch(0.31 0.07 294 / .45), transparent 48%);
      z-index: -1;
    }

    svg { display: block; width: 100%; height: 100%; }
    .otter-body { transform-origin: 290px 370px; animation: breathe 3s var(--ease) infinite; }
    .head { transform-origin: 300px 245px; animation: nod 6s var(--ease) infinite; }
    .tail { transform-origin: 210px 420px; animation: tail 3s var(--ease) infinite; }
    .near-arm { transform-origin: 360px 325px; animation: reach 2s var(--ease) infinite; }
    .paw { transform-origin: 465px 347px; animation: spin 2s linear infinite; }
    .crank { transform-origin: 465px 347px; animation: spin 2s linear infinite; }
    .apple { transform-origin: 585px 328px; animation: spin 1.2s linear infinite; }
    .blade { transform-origin: 555px 305px; animation: blade 6s var(--ease) infinite; }
    .peel { stroke-dasharray: 260; stroke-dashoffset: 260; animation: peel 6s linear infinite; }
    .peel-end { animation: peel-end 6s linear infinite; }
    .blink { transform-origin: center; animation: blink 5s linear infinite; }
    .spark { animation: spark 6s var(--ease) infinite; }
    .paused * { animation-play-state: paused !important; }

    .controls { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
    .control {
      min-height: 44px;
      padding: 0 16px;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      transition: color 180ms var(--ease), border-color 180ms var(--ease), background 180ms var(--ease), transform 180ms var(--ease);
    }

    .control.primary { color: oklch(1 0 0); background: var(--primary); border-color: transparent; font-weight: 720; }
    .control:hover { border-color: var(--primary-hi); transform: translateY(-1px); }
    .control.primary:hover { background: var(--primary-hi); }
    .control:focus-visible { outline: 3px solid var(--primary-hi); outline-offset: 3px; }
    .control[aria-pressed="true"]:not(.primary) { background: var(--surface-2); border-color: var(--primary-hi); }
    .control:disabled { cursor: not-allowed; opacity: .5; transform: none; }
    .status { margin-left: auto; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 18px clamp(20px, 4vw, 64px);
      color: var(--muted);
      border-top: 1px solid var(--line);
      font-size: 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
    @keyframes nod { 0%, 12%, 78%, 100% { transform: rotate(-2deg); } 38%, 64% { transform: rotate(3deg); } }
    @keyframes tail { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }
    @keyframes reach { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(3deg); } }
    @keyframes blade { 0%, 12% { transform: translateX(-7px); } 28%, 75% { transform: translateX(8px); } 88%, 100% { transform: translateX(-7px); } }
    @keyframes peel { 0%, 10% { stroke-dashoffset: 260; } 72%, 100% { stroke-dashoffset: 0; } }
    @keyframes peel-end { 0%, 12% { opacity: 0; transform: translateY(-12px); } 60%, 100% { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 46%, 50%, 100% { transform: scaleY(1); } 48% { transform: scaleY(.08); } }
    @keyframes spark { 0%, 68%, 100% { opacity: 0; transform: scale(.5); } 76% { opacity: 1; transform: scale(1); } }

    @media (max-width: 900px) {
      .page { overflow: visible; }
      main { grid-template-columns: 1fr; align-items: start; }
      .intro { max-width: 680px; }
      .stage-wrap { width: min(100%, 800px); }
    }

    @media (max-width: 560px) {
      .top-note { display: none; }
      main { padding-top: 34px; }
      h1 { font-size: clamp(38px, 14vw, 58px); }
      .stage { aspect-ratio: 4 / 3; }
      .controls { flex-wrap: wrap; }
      .status { width: 100%; margin: 2px 0 0; }
      footer { flex-direction: column; gap: 5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
      .peel { stroke-dashoffset: 0; }
      .peel-end, .spark { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>小爪工坊</div>
      <div class="top-note">SVG 机械动画实验 · 01</div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">水獭，<br>开机削苹果。</h1>
        <p class="lede">一圈摇柄带动四件事：小爪转动、苹果旋转、刀片贴近，最后落下一整条卷曲果皮。</p>
        <ol class="beats" aria-label="动画动作节拍">
          <li>握紧摇柄</li><li>苹果旋转</li><li>刀片进给</li><li>果皮落盘</li>
        </ol>
      </section>

      <section class="stage-wrap" aria-label="水獭操作苹果削皮机动画">
        <div class="stage" id="stage">
          <svg viewBox="0 0 900 560" role="img" aria-labelledby="svg-title svg-desc">
            <title id="svg-title">水獭操作手摇苹果削皮机</title>
            <desc id="svg-desc">棕色水獭站在紫色手摇削皮机前转动摇柄，红苹果随轴旋转，银色刀片削出螺旋状果皮。</desc>
            <defs>
              <linearGradient id="otterFur" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="oklch(0.64 0.13 55)"/><stop offset="1" stop-color="oklch(0.42 0.10 45)"/>
              </linearGradient>
              <linearGradient id="appleSkin" x1="0" y1="0" x2=".8" y2="1">
                <stop offset="0" stop-color="var(--apple-hi)"/><stop offset=".42" stop-color="var(--apple)"/><stop offset="1" stop-color="oklch(0.42 0.17 24)"/>
              </linearGradient>
              <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
            </defs>

            <ellipse cx="482" cy="467" rx="335" ry="37" fill="oklch(0.06 0 0 / .58)" filter="url(#softShadow)"/>
            <path d="M70 453H830" stroke="var(--line)" stroke-width="2"/>

            <g class="tail"><path d="M229 409C166 397 115 425 109 461C153 442 192 452 236 448" fill="url(#otterFur)" stroke="oklch(0.31 0.07 44)" stroke-width="6" stroke-linecap="round"/></g>
            <g class="otter-body">
              <ellipse cx="285" cy="379" rx="88" ry="103" fill="url(#otterFur)" stroke="oklch(0.31 0.07 44)" stroke-width="7"/>
              <ellipse cx="303" cy="391" rx="56" ry="71" fill="oklch(0.78 0.09 70)" opacity=".92"/>
              <ellipse cx="246" cy="463" rx="36" ry="15" fill="oklch(0.36 0.08 44)"/><ellipse cx="330" cy="463" rx="36" ry="15" fill="oklch(0.36 0.08 44)"/>
            </g>

            <g class="head">
              <circle cx="248" cy="231" r="31" fill="oklch(0.47 0.11 45)" stroke="oklch(0.31 0.07 44)" stroke-width="6"/>
              <circle cx="351" cy="231" r="31" fill="oklch(0.47 0.11 45)" stroke="oklch(0.31 0.07 44)" stroke-width="6"/>
              <circle cx="299" cy="263" r="75" fill="url(#otterFur)" stroke="oklch(0.31 0.07 44)" stroke-width="7"/>
              <ellipse cx="302" cy="289" rx="48" ry="39" fill="oklch(0.82 0.08 72)"/>
              <g class="blink" fill="oklch(0.12 0.02 44)"><ellipse cx="274" cy="258" rx="8" ry="10"/><ellipse cx="327" cy="258" rx="8" ry="10"/></g>
              <path d="M292 279Q302 271 312 279Q306 291 302 291Q297 291 292 279" fill="oklch(0.18 0.04 30)"/>
              <path d="M302 291Q299 305 285 304M302 291Q305 305 319 304" fill="none" stroke="oklch(0.28 0.07 40)" stroke-width="3" stroke-linecap="round"/>
              <g fill="none" stroke="oklch(0.90 0.03 70 / .72)" stroke-width="2" stroke-linecap="round"><path d="M263 286L213 278M263 294L207 299M340 286L389 276M339 295L394 302"/></g>
            </g>

            <!-- 手摇削皮机 -->
            <g aria-hidden="true">
              <path d="M438 424H767L790 454H416Z" fill="var(--primary)" stroke="oklch(0.37 0.11 294)" stroke-width="6" stroke-linejoin="round"/>
              <path d="M455 417V283H478V417M726 417V274H749V417" fill="none" stroke="var(--primary-hi)" stroke-width="17" stroke-linecap="round"/>
              <path d="M464 296H735" stroke="var(--steel)" stroke-width="12" stroke-linecap="round"/><path d="M464 296L485 283V309Z" fill="var(--steel)"/>
              <circle cx="729" cy="296" r="19" fill="var(--surface-2)" stroke="var(--steel)" stroke-width="8"/>
              <path d="M425 431V470M780 431V470" stroke="oklch(0.34 0.08 294)" stroke-width="18" stroke-linecap="round"/>
              <ellipse cx="425" cy="474" rx="32" ry="9" fill="var(--primary-hi)"/><ellipse cx="780" cy="474" rx="32" ry="9" fill="var(--primary-hi)"/>
            </g>

            <g class="apple">
              <path d="M585 266C548 245 514 270 514 319C514 371 550 392 585 378C620 393 657 371 657 319C657 270 622 245 585 266Z" fill="url(#appleSkin)" stroke="oklch(0.38 0.14 24)" stroke-width="6"/>
              <path d="M585 263Q579 241 592 226" fill="none" stroke="oklch(0.31 0.09 56)" stroke-width="8" stroke-linecap="round"/>
              <path d="M591 238Q621 221 635 244Q611 254 591 238" fill="var(--leaf)"/>
              <path d="M531 300C544 281 557 275 566 274" fill="none" stroke="oklch(0.88 0.09 40 / .8)" stroke-width="9" stroke-linecap="round"/>
              <path d="M520 325Q585 306 651 325M523 347Q585 331 648 347" fill="none" stroke="oklch(0.86 0.10 50 / .28)" stroke-width="5"/>
            </g>

            <g class="blade">
              <path d="M520 226V395" stroke="var(--steel)" stroke-width="11" stroke-linecap="round"/>
              <path d="M520 318L548 304L548 336Z" fill="oklch(0.91 0.025 250)" stroke="oklch(0.50 0.05 250)" stroke-width="4" stroke-linejoin="round"/>
              <circle cx="520" cy="403" r="12" fill="var(--accent)"/>
            </g>

            <path class="peel" d="M548 326C526 342 538 360 568 370C604 382 630 396 617 416C604 435 566 425 555 449C546 470 579 478 596 461" fill="none" stroke="var(--accent)" stroke-width="11" stroke-linecap="round"/>
            <path class="peel-end" d="M584 454Q605 443 625 460Q604 477 584 454" fill="var(--accent)"/>

            <g class="crank">
              <circle cx="465" cy="347" r="50" fill="none" stroke="oklch(0.79 0.04 250)" stroke-width="10"/>
              <path d="M465 347L416 350" stroke="var(--steel)" stroke-width="10" stroke-linecap="round"/>
              <circle cx="416" cy="350" r="15" fill="var(--accent)" stroke="oklch(0.48 0.13 45)" stroke-width="5"/>
            </g>
            <g class="near-arm">
              <path d="M352 331Q390 329 414 348" fill="none" stroke="oklch(0.49 0.11 47)" stroke-width="27" stroke-linecap="round"/>
              <g class="paw"><ellipse cx="416" cy="350" rx="22" ry="18" fill="oklch(0.70 0.10 63)" stroke="oklch(0.31 0.07 44)" stroke-width="5"/><path d="M406 344L397 337M414 341L409 330M422 343L424 331" stroke="oklch(0.31 0.07 44)" stroke-width="3" stroke-linecap="round"/></g>
            </g>
            <path d="M348 362Q388 377 407 395" fill="none" stroke="oklch(0.43 0.10 45)" stroke-width="25" stroke-linecap="round"/>
            <ellipse cx="412" cy="399" rx="21" ry="17" fill="oklch(0.70 0.10 63)" stroke="oklch(0.31 0.07 44)" stroke-width="5"/>

            <g class="spark" fill="var(--accent)" aria-hidden="true"><path d="M674 225L680 242L697 248L680 254L674 271L668 254L651 248L668 242Z"/><circle cx="709" cy="278" r="7"/><circle cx="665" cy="288" r="5"/></g>
          </svg>
        </div>

        <div class="controls" aria-label="动画控制">
          <button class="control primary" id="toggle" type="button" aria-pressed="false">暂停</button>
          <button class="control" id="speed" type="button" aria-pressed="false">慢速</button>
          <button class="control" id="replay" type="button">重播</button>
          <span class="status" id="status" role="status" aria-live="polite">正在削皮 · 1×</span>
        </div>
      </section>
    </main>

    <footer><span>题目与结果合并展示</span><span>单文件 · 内联 SVG · 无外部依赖</span></footer>
  </div>

  <script>
    (() => {
      const stage = document.querySelector('#stage');
      const toggle = document.querySelector('#toggle');
      const speed = document.querySelector('#speed');
      const replay = document.querySelector('#replay');
      const status = document.querySelector('#status');
      const animated = [...stage.querySelectorAll('*')].filter((node) => getComputedStyle(node).animationName !== 'none');
      const originalDurations = animated.map((node) => node.style.animationDuration);
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      let paused = false;
      let slow = false;

      const setStatus = (message) => { status.textContent = message; };

      toggle.addEventListener('click', () => {
        paused = !paused;
        stage.classList.toggle('paused', paused);
        toggle.textContent = paused ? '播放' : '暂停';
        toggle.setAttribute('aria-pressed', String(paused));
        setStatus(paused ? '动画已暂停' : `正在削皮 · ${slow ? '.6×' : '1×'}`);
      });

      speed.addEventListener('click', () => {
        slow = !slow;
        animated.forEach((node, index) => {
          node.style.animationDuration = slow
            ? `${parseFloat(getComputedStyle(node).animationDuration) * 1.65}s`
            : originalDurations[index];
        });
        speed.textContent = slow ? '正常速度' : '慢速';
        speed.setAttribute('aria-pressed', String(slow));
        setStatus(paused ? '动画已暂停' : `正在削皮 · ${slow ? '.6×' : '1×'}`);
      });

      replay.addEventListener('click', () => {
        animated.forEach((node) => {
          node.style.animationName = 'none';
          void node.getBoundingClientRect();
          node.style.animationName = '';
        });
        if (paused) toggle.click();
        setStatus(`从头播放 · ${slow ? '.6×' : '1×'}`);
      });

      const syncMotionPreference = () => {
        const reduced = reducedMotion.matches;
        toggle.disabled = reduced;
        speed.disabled = reduced;
        setStatus(reduced ? '已按系统设置减少动态' : `正在削皮 · ${slow ? '.6×' : '1×'}`);
      };

      reducedMotion.addEventListener?.('change', syncMotionPreference);
      syncMotionPreference();
    })();
  </script>
</body>
</html>
